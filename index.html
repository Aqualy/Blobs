<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Compose static and animated blob shapes that grow smooth organic bridges when they get close. Export PNG, SVG and video.">
  <meta name="theme-color" content="#18181a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="src/vendor/lit-core.min.js">

<body>
